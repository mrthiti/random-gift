<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>จับสลากของขวัญ 🎁</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', sans-serif;
      min-height: 100vh;
      background: #f5f5f5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .card {
      background: #fff8f0;
      border-radius: 24px;
      padding: 36px 40px;
      width: 100%;
      max-width: 480px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.12);
      position: relative;
      border-top: 6px solid #e74c3c;
    }

    .card::before {
      content: '🎀';
      position: absolute;
      top: -18px; left: 50%;
      transform: translateX(-50%);
      font-size: 2rem;
    }

    h1 { text-align: center; font-size: 1.75rem; color: #922b21; margin-bottom: 4px; }
    .subtitle { text-align: center; color: #aaa; font-size: 0.88rem; margin-bottom: 24px; }

    /* ── Sound toggle ── */
    .sound-toggle {
      position: absolute;
      top: 16px; right: 16px;
      background: #fdecea;
      border: none;
      border-radius: 50%;
      width: 36px; height: 36px;
      font-size: 1.1rem;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: background 0.2s, transform 0.1s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .sound-toggle:hover { background: #f5cba7; }
    .sound-toggle:active { transform: scale(0.9); }

    /* ── Textarea ── */
    .textarea-wrap { position: relative; margin-bottom: 6px; }

    textarea {
      width: 100%;
      height: 130px;
      padding: 12px;
      padding-bottom: 36px;
      border: 2px solid #f5cba7;
      border-radius: 12px;
      font-size: 1rem;
      resize: vertical;
      outline: none;
      background: #fffaf6;
      transition: border-color 0.2s;
      font-family: inherit;
    }
    textarea:focus { border-color: #e74c3c; }

    .textarea-toolbar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 32px;
      background: #fef3ec;
      border: 2px solid #f5cba7;
      border-top: 1px solid #f5cba7;
      border-radius: 0 0 12px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 10px;
      pointer-events: none;
    }

    .name-count { font-size: 0.78rem; color: #c0392b; font-weight: 600; }

    .dup-badge {
      font-size: 0.72rem; color: #e67e22;
      background: #fdebd0; border-radius: 20px;
      padding: 1px 8px; display: none;
    }
    .dup-badge.show { display: inline-block; }

    .hint { font-size: 0.8rem; color: #bbb; margin: 6px 0 16px; }

    .dedup-preview {
      background: #fff3cd; border: 1px solid #ffc107;
      border-radius: 10px; padding: 10px 14px;
      margin-bottom: 16px; font-size: 0.8rem;
      color: #856404; display: none;
    }
    .dedup-preview.show { display: block; }
    .dedup-preview strong { display: block; margin-bottom: 6px; }
    .dedup-list { display: flex; flex-wrap: wrap; gap: 4px; }
    .dedup-tag {
      background: #fff8e1; border: 1px solid #ffc107;
      border-radius: 20px; padding: 2px 10px;
      font-size: 0.75rem; color: #856404;
    }

    .buttons { display: flex; gap: 10px; margin-bottom: 20px; }
    button {
      flex: 1; padding: 14px; border: none; border-radius: 12px;
      font-size: 1rem; cursor: pointer; font-weight: bold;
      transition: transform 0.1s, opacity 0.2s;
    }
    button:active { transform: scale(0.97); }
    button:disabled { opacity: 0.45; cursor: not-allowed; }
    #pickBtn {
      background: linear-gradient(135deg, #e74c3c, #922b21);
      color: white; font-size: 1.05rem; letter-spacing: 0.5px;
    }
    #resetBtn { background: #f5eee6; color: #888; }

    /* ── Slot Machine ── */
    .slot-wrapper {
      background: #2c0a0a; border-radius: 16px; padding: 8px;
      margin-bottom: 16px;
      box-shadow: inset 0 4px 12px rgba(0,0,0,0.5), 0 0 0 3px #7b241c;
    }
    .slot-label {
      text-align: center; font-size: 0.7rem; color: #a04040;
      letter-spacing: 2px; text-transform: uppercase; padding: 4px 0 8px;
    }
    .slot-screen {
      height: 90px; overflow: hidden;
      position: relative; border-radius: 10px; background: #1a0505;
    }
    .slot-screen::before {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(to bottom, #1a0505 0%, transparent 35%, transparent 65%, #1a0505 100%);
      z-index: 2; pointer-events: none; border-radius: 10px;
    }
    .slot-screen::after {
      content: ''; position: absolute; inset: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(255,255,255,0.02) 3px, rgba(255,255,255,0.02) 4px);
      z-index: 3; pointer-events: none;
    }
    .slot-highlight {
      position: absolute; top: 50%; left: 0; right: 0;
      transform: translateY(-50%); height: 46px;
      border-top: 1.5px solid rgba(231,76,60,0.7);
      border-bottom: 1.5px solid rgba(231,76,60,0.7);
      background: rgba(231,76,60,0.08);
      z-index: 1; pointer-events: none;
    }
    .slot-reel { display: flex; flex-direction: column; will-change: transform; }
    .slot-item {
      height: 90px; display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem; font-weight: bold;
      color: rgba(255,200,180,0.7);
      padding: 0 16px; text-align: center; flex-shrink: 0; word-break: break-word;
    }
    .slot-item.active {
      color: #ffd700;
      text-shadow: 0 0 18px rgba(255,215,0,0.8), 0 0 40px rgba(255,100,50,0.4);
    }

    @keyframes flash {
      0%,100% { background: #1a0505; }
      30%      { background: #5c1010; }
      60%      { background: #1a0505; }
    }
    .slot-screen.flash { animation: flash 0.5s ease; }

    /* ── Confetti ── */
    .confetti-wrap { position: fixed; inset: 0; pointer-events: none; z-index: 999; overflow: hidden; }
    .confetti-piece { position: absolute; top: -20px; font-size: 1.4rem; animation: confettiFall linear forwards; }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg);      opacity: 1; }
      100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
    }

    .counter { text-align:center; font-size:.82rem; color:#bbb; margin-bottom:16px; }
    .history { font-size:.85rem; color:#999; }
    .history strong { color:#c0392b; display:block; margin-bottom:8px; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; }
    .tag { background:#fdecea; color:#c0392b; border-radius:20px; padding:4px 12px; font-size:.8rem; }
    .badge { display:inline-block; background:#fdecea; color:#c0392b; font-size:.7rem; border-radius:20px; padding:2px 8px; margin-left:6px; }
  </style>
</head>
<body>
<div class="card">
  <button class="sound-toggle" id="soundToggle" onclick="toggleSound()" title="เปิด/ปิดเสียง">🔊</button>

  <h1>🎁 จับสลากของขวัญ</h1>
  <p class="subtitle">ใส่ชื่อผู้ร่วมสนุก แล้วลุ้นกัน! <span class="badge">🔐 สุ่มจริง</span></p>

  <div class="textarea-wrap">
    <textarea id="nameInput"
      placeholder="ใส่ชื่อผู้ร่วมสนุกที่นี่&#10;(คนละบรรทัด เช่น&#10;🎅 คุณสมชาย&#10;🤶 คุณสมหญิง&#10;🦌 น้องแจ็ค)"
      oninput="onInputChange()"></textarea>
    <div class="textarea-toolbar">
      <div class="name-count" id="nameCount">👥 0 คน</div>
      <div class="dup-badge" id="dupBadge">⚠️ มีชื่อซ้ำ จะถูกตัดออกอัตโนมัติ</div>
    </div>
  </div>
  <p class="hint">🎄 ใส่ชื่อทีละบรรทัด หรือคั่นด้วยจุลภาค (,)</p>

  <div class="dedup-preview" id="dedupPreview">
    <strong>✅ ชื่อที่จะใช้สุ่ม (ตัดซ้ำแล้ว)</strong>
    <div class="dedup-list" id="dedupList"></div>
  </div>

  <div class="buttons">
    <button id="pickBtn" onclick="pickName()">🎁 เปิดซองนำโชค!</button>
    <button id="resetBtn" onclick="resetAll()">🔄 จับใหม่อีกรอบ</button>
  </div>

  <div class="slot-wrapper">
    <div class="slot-label">🎀 ผู้โชคดีได้รับของขวัญ 🎀</div>
    <div class="slot-screen" id="slotScreen">
      <div class="slot-highlight"></div>
      <div class="slot-reel" id="slotReel">
        <div class="slot-item active">🎁 ใครจะโชคดี? 🎁</div>
      </div>
    </div>
  </div>

  <div class="counter" id="counter"></div>
  <div class="history" id="historyBox" style="display:none">
    <strong>🎀 ผู้โชคดีที่ได้รับของขวัญแล้ว</strong>
    <div class="tags" id="historyTags"></div>
  </div>
</div>

<div class="confetti-wrap" id="confettiWrap"></div>

<script>
  const ITEM_H   = 90;
  let picked     = [];
  let isSpinning = false;
  let soundOn    = true;

  const CONFETTI = ['🎁','🎀','⭐','❄️','🎄','🔔','✨','🌟','🎊','🎉'];

  /* ════════════════════════════════
     🔊 Web Audio API — sound engine
  ════════════════════════════════ */
  let audioCtx = null;

  function getAudioCtx() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    // resume ถ้า suspended (browser policy)
    if (audioCtx.state === 'suspended') audioCtx.resume();
    return audioCtx;
  }

  /* เสียง tick ตอนหมุน — เสียงสั้นคล้าย slot click */
  function playTick(pitch = 1) {
    if (!soundOn) return;
    const ctx  = getAudioCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type            = 'square';
    osc.frequency.value = 180 * pitch;
    gain.gain.setValueAtTime(0.08, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.06);

    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.06);
  }

  /* เสียงชนะ — fanfare สั้นๆ 3 โน้ต */
  function playWin() {
    if (!soundOn) return;
    const ctx    = getAudioCtx();
    const notes  = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
    const delays = [0, 0.12, 0.24, 0.38];

    notes.forEach((freq, i) => {
      const osc  = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.type            = 'sine';
      osc.frequency.value = freq;
      const t = ctx.currentTime + delays[i];
      gain.gain.setValueAtTime(0, t);
      gain.gain.linearRampToValueAtTime(0.25, t + 0.04);
      gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);

      osc.start(t);
      osc.stop(t + 0.45);
    });
  }

  /* เสียงกดปุ่ม */
  function playClick() {
    if (!soundOn) return;
    const ctx  = getAudioCtx();
    const osc  = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);

    osc.type            = 'sine';
    osc.frequency.value = 400;
    gain.gain.setValueAtTime(0.15, ctx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.1);

    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.1);
  }

  /* toggle เสียง */
  function toggleSound() {
    soundOn = !soundOn;
    document.getElementById('soundToggle').textContent = soundOn ? '🔊' : '🔇';
    if (soundOn) playClick();
  }

  /* ════════════════════════════════
     🎲 Crypto helpers
  ════════════════════════════════ */
  function cryptoRandom(max) {
    const a = new Uint32Array(1);
    crypto.getRandomValues(a);
    return a[0] % max;
  }
  function cryptoShuffle(arr) {
    const a = [...arr];
    for (let i = a.length - 1; i > 0; i--) {
      const j = cryptoRandom(i + 1);
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function easeOut(t) { return 1 - Math.pow(1 - t, 3); }

  /* ════════════════════════════════
     📋 Name helpers
  ════════════════════════════════ */
  function getRawNames() {
    return document.getElementById('nameInput').value
      .split(/[\n,]+/).map(n => n.trim()).filter(n => n.length > 0);
  }
  function getUniqueNames() { return [...new Set(getRawNames())]; }

  function onInputChange() {
    const raw    = getRawNames();
    const unique = getUniqueNames();
    const hasDup = raw.length !== unique.length;

    document.getElementById('nameCount').textContent = `👥 ${unique.length} คน`;
    document.getElementById('dupBadge').classList.toggle('show', hasDup);

    const preview = document.getElementById('dedupPreview');
    const list    = document.getElementById('dedupList');
    if (hasDup) {
      preview.classList.add('show');
      list.innerHTML = unique.map(n => `<span class="dedup-tag">${n}</span>`).join('');
    } else {
      preview.classList.remove('show');
      list.innerHTML = '';
    }
  }

  /* ════════════════════════════════
     🎊 Confetti
  ════════════════════════════════ */
  function burstConfetti() {
    const wrap = document.getElementById('confettiWrap');
    wrap.innerHTML = '';
    for (let i = 0; i < 40; i++) {
      const el = document.createElement('div');
      el.className   = 'confetti-piece';
      el.textContent = CONFETTI[cryptoRandom(CONFETTI.length)];
      el.style.left  = cryptoRandom(100) + 'vw';
      el.style.fontSize = (1 + cryptoRandom(15) / 10) + 'rem';
      const dur = 1.8 + cryptoRandom(20) / 10;
      el.style.animationDuration = dur + 's';
      el.style.animationDelay   = (cryptoRandom(8) / 10) + 's';
      wrap.appendChild(el);
    }
    setTimeout(() => wrap.innerHTML = '', 4000);
  }

  /* ════════════════════════════════
     🎰 Reel
  ════════════════════════════════ */
  function buildReel(items) {
    const reel = document.getElementById('slotReel');
    reel.innerHTML = '';
    reel.style.transform = 'translateY(0px)';
    items.forEach(name => {
      const div = document.createElement('div');
      div.className   = 'slot-item';
      div.textContent = name;
      reel.appendChild(div);
    });
    return reel;
  }

  function animateReel(reel, targetIndex, duration, onDone) {
    const totalScroll = targetIndex * ITEM_H;
    const startTime   = performance.now();
    let lastItem      = -1;      // ติดตาม item ที่ผ่านไปเพื่อ tick

    function frame(now) {
      const elapsed  = now - startTime;
      const progress = Math.min(elapsed / duration, 1);
      const eased    = easeOut(progress);
      const currentY = eased * totalScroll;

      reel.style.transform = `translateY(${-currentY}px)`;

      // เล่นเสียง tick ทุกครั้งที่เลื่อนผ่าน item ใหม่
      const currentItem = Math.floor(currentY / ITEM_H);
      if (currentItem !== lastItem) {
        // pitch สูงขึ้นเรื่อยๆ เมื่อใกล้หยุด (ตาม progress)
        const pitch = 0.8 + eased * 0.8;
        playTick(pitch);
        lastItem = currentItem;
      }

      if (progress < 1) requestAnimationFrame(frame);
      else { reel.style.transform = `translateY(${-totalScroll}px)`; onDone(); }
    }
    requestAnimationFrame(frame);
  }

  /* ════════════════════════════════
     🎁 Pick
  ════════════════════════════════ */
  function pickName() {
    if (isSpinning) return;
    playClick();

    const all = getUniqueNames();
    if (!all.length) { alert('🎄 กรุณาใส่ชื่อผู้ร่วมสนุกก่อนนะคะ!'); return; }

    const remaining = all.filter(n => !picked.includes(n));
    if (!remaining.length) { alert('🎁 แจกของขวัญครบทุกคนแล้ว!\nกด "จับใหม่อีกรอบ" เพื่อเริ่มใหม่'); return; }

    isSpinning = true;
    document.getElementById('pickBtn').disabled  = true;
    document.getElementById('resetBtn').disabled = true;

    const winner    = cryptoShuffle(remaining)[0];
    const loopCount = 20 + cryptoRandom(12);
    const fakeNames = Array.from({ length: loopCount }, () =>
      remaining[cryptoRandom(remaining.length)]
    );
    const strip    = [...fakeNames, winner];
    const reel     = buildReel(strip);
    const duration = 2800 + cryptoRandom(600);

    animateReel(reel, loopCount, duration, () => {
      reel.querySelectorAll('.slot-item')[loopCount].classList.add('active');

      const screen = document.getElementById('slotScreen');
      screen.classList.add('flash');
      setTimeout(() => screen.classList.remove('flash'), 500);

      playWin();      // 🎵 เสียงชนะ!
      burstConfetti();

      picked.push(winner);
      updateUI(all);
      isSpinning = false;
      document.getElementById('pickBtn').disabled  = false;
      document.getElementById('resetBtn').disabled = false;
    });
  }

  function updateUI(all) {
    const rem = all.length - picked.length;
    document.getElementById('counter').textContent =
      rem > 0
        ? `🎄 เหลือของขวัญอีก ${rem} ชิ้น จากทั้งหมด ${all.length} ชิ้น`
        : `🎉 แจกของขวัญครบทุกคนแล้ว!`;

    const box  = document.getElementById('historyBox');
    const tags = document.getElementById('historyTags');
    if (picked.length > 0) {
      box.style.display = 'block';
      tags.innerHTML = picked.map((n, i) =>
        `<span class="tag">🎁 ${i + 1}. ${n}</span>`
      ).join('');
    }
  }

  function resetAll() {
    if (isSpinning) return;
    playClick();
    picked = [];
    const reel = document.getElementById('slotReel');
    reel.innerHTML = '<div class="slot-item active">🎁 ใครจะโชคดี? 🎁</div>';
    reel.style.transform = 'translateY(0px)';
    document.getElementById('counter').textContent      = '';
    document.getElementById('historyBox').style.display = 'none';
    document.getElementById('historyTags').innerHTML    = '';
  }
</script>
</body>
</html>
